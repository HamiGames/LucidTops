# LucidTops Pi console stack.
# Start together after proxy has written Master.secrets and proxy.secrets.
# Export DOCKER_NETWORK_NAME from Master.secrets before compose up.
# The network is created by the proxy container's bootstrap; it must exist first.
#
# operations, Rdp, useronly, and AdminGui images are built on this console
# after Master.secrets and proxy.secrets exist. They are not started here.
# AdminGui may be started on this console separately; it reads Server/Secrets.

services:
  lucid-proxy:
    image: lucid-proxy:v1.0.0
    container_name: lucid-proxy
    restart: unless-stopped
    environment:
      LUCID_TOPS_ROOT: /mnt/myssd/LucidTops
      SECRETS_DIR: /mnt/myssd/LucidTops/Server/Secrets
      PROXY_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/proxy.secrets
      MASTER_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/Master.secrets
    volumes:
      - /mnt/myssd/LucidTops:/mnt/myssd/LucidTops
    networks:
      - lucid

  lucid-databases:
    image: lucid-databases-orchestrator:v1.0.0
    container_name: lucid-databases-orchestrator
    restart: unless-stopped
    depends_on:
      - lucid-proxy
    environment:
      LUCID_TOPS_ROOT: /mnt/myssd/LucidTops
      SECRETS_DIR: /mnt/myssd/LucidTops/Server/Secrets
      DATABASES_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/databases.secrets
      MONGODB_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/mongodb.secrets
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /mnt/myssd/LucidTops:/mnt/myssd/LucidTops
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lucid

  lucid-server-default:
    image: lucid-server-default:v1.0.0
    container_name: lucid-server-default
    restart: unless-stopped
    depends_on:
      - lucid-proxy
      - lucid-databases
    environment:
      LUCID_TOPS_ROOT: /mnt/myssd/LucidTops
      SECRETS_DIR: /mnt/myssd/LucidTops/Server/Secrets
      MASTER_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/Master.secrets
      PROXY_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/proxy.secrets
      SERVER_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/server.secrets
      CONFIG_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/config.secrets
      BACKEND_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/backend.secrets
      HOST_TOR_CONFIG_TORRC: /mnt/myssd/LucidTops/torrc
      RUN_BUILDER_ON_START: "true"
    volumes:
      - /mnt/myssd/LucidTops:/mnt/myssd/LucidTops
    networks:
      - lucid

  lucid-frontend:
    image: lucid-frontend:v1.0.0
    container_name: lucid-frontend
    restart: unless-stopped
    depends_on:
      - lucid-server-default
    environment:
      LUCID_TOPS_ROOT: /mnt/myssd/LucidTops
      SECRETS_DIR: /mnt/myssd/LucidTops/Server/Secrets
      FRONTEND_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/frontend.secrets
      MASTER_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/Master.secrets
      PROXY_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/proxy.secrets
      HOST_TOR_CONFIG_TORRC: /mnt/myssd/LucidTops/torrc
    volumes:
      - /mnt/myssd/LucidTops:/mnt/myssd/LucidTops
    networks:
      - lucid

  lucid-sessions:
    image: lucid-sessions:v1.0.0
    container_name: lucid-sessions
    restart: unless-stopped
    depends_on:
      - lucid-server-default
    environment:
      LUCID_TOPS_ROOT: /mnt/myssd/LucidTops
      SECRETS_DIR: /mnt/myssd/LucidTops/Server/Secrets
      SESSIONS_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/sessions.secrets
      MASTER_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/Master.secrets
      PROXY_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/proxy.secrets
      HOST_TOR_CONFIG_TORRC: /mnt/myssd/LucidTops/torrc
    volumes:
      - /mnt/myssd/LucidTops:/mnt/myssd/LucidTops
    networks:
      - lucid

  lucid-blockchain:
    image: lucid-blockchain:v1.0.0
    container_name: lucid-blockchain
    restart: unless-stopped
    depends_on:
      - lucid-databases
      - lucid-server-default
    environment:
      LUCID_TOPS_ROOT: /mnt/myssd/LucidTops
      SECRETS_DIR: /mnt/myssd/LucidTops/Server/Secrets
      BLOCKCHAIN_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/blockchain.secrets
      MASTER_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/Master.secrets
      PROXY_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/proxy.secrets
    volumes:
      - /mnt/myssd/LucidTops:/mnt/myssd/LucidTops
    networks:
      - lucid

  lucid-paysystems:
    image: lucid-paysystems:v1.0.0
    container_name: lucid-paysystems
    restart: unless-stopped
    depends_on:
      - lucid-server-default
    environment:
      LUCID_TOPS_ROOT: /mnt/myssd/LucidTops
      SECRETS_DIR: /mnt/myssd/LucidTops/Server/Secrets
      PAYMENTS_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/payments.secrets
      MASTER_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/Master.secrets
      PROXY_SECRETS_FILE: /mnt/myssd/LucidTops/Server/Secrets/proxy.secrets
      HOST_TOR_CONFIG_TORRC: /mnt/myssd/LucidTops/torrc
    volumes:
      - /mnt/myssd/LucidTops:/mnt/myssd/LucidTops
    networks:
      - lucid

networks:
  lucid:
    name: ${DOCKER_NETWORK_NAME}
    external: true
